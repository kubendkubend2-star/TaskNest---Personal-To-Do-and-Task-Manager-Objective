# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=tasknest-backend

# Server Port (8081 is used to avoid port collisions with other local services)
server.port=8081

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Default connects to MySQL 8.0 on port 3307 (local environment).
# To connect to a standard MySQL on port 3306, adjust DB_PORT or change 3307 to 3306.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:tasknest_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
